name: Secret & Sensitive Data Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    name: Scan for sensitive data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run sensitive data scanner
        id: scan
        run: |
          set +e
          FOUND=0
          REPORT=""

          # ── Patterns ────────────────────────────────────────────────────
          # GitHub tokens
          PAT_PATTERN='gh[ps]_[A-Za-z0-9]{36,}'
          # Generic API keys / secrets
          SECRET_PATTERN='(api[_-]?key|api[_-]?secret|access[_-]?token|auth[_-]?token|client[_-]?secret)\s*[:=]\s*["\x27]?[A-Za-z0-9+/\-_]{16,}'
          # Private IPv4 (RFC1918 + Tailscale 100.x)
          PRIVATE_IP='(^|[^0-9])(10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3}|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3})([^0-9]|$)'
          # Public routable IPv4 (not 127/0/255)
          PUBLIC_IP='(^|[^0-9])((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9][0-9]|[1-9])\.(25[0-5]|2[0-4][0-9]|[0-9]{1,3})\.(25[0-5]|2[0-4][0-9]|[0-9]{1,3})\.(25[0-5]|2[0-4][0-9]|[0-9]{1,3}))([^0-9]|$)'
          # Absolute filesystem paths
          FS_PATH='(^|[ \t`"])(\/(?:etc|var|home|root|opt|srv|tmp|usr)\/[^\s"` ]{3,})'
          # Private SSH keys
          SSH_KEY='-----BEGIN (RSA|EC|OPENSSH|DSA) PRIVATE KEY-----'
          # Hardcoded passwords
          PASSWORD='(password|passwd|pwd)\s*[:=]\s*["\x27]?[A-Za-z0-9!@#$%^&*()_+\-]{8,}'

          FILES=$(git ls-files | grep -Ev '\.(png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|pdf|zip|tar|gz)$' | grep -Ev '^\.github/workflows/')

          check() {
            local label="$1"
            local pattern="$2"
            local matches
            matches=$(echo "$FILES" | xargs grep -InE "$pattern" 2>/dev/null | grep -v '# noqa' | grep -v 'PLACEHOLDER' | grep -v '<.*>' | grep -v 'example\.com')
            if [ -n "$matches" ]; then
              FOUND=1
              REPORT="${REPORT}\n### ❌ ${label}\n\`\`\`\n${matches}\n\`\`\`\n"
            fi
          }

          check "GitHub PAT / tokens"           "$PAT_PATTERN"
          check "API keys / secrets"            "$SECRET_PATTERN"
          check "Privata IP-adresser"           "$PRIVATE_IP"
          check "Publika IP-adresser"           "$PUBLIC_IP"
          check "Absoluta filsystemssökvägar"   "$FS_PATH"
          check "SSH-nycklar"                   "$SSH_KEY"
          check "Hårdkodade lösenord"           "$PASSWORD"

          # ── Output ───────────────────────────────────────────────────────
          if [ "$FOUND" -eq 1 ]; then
            echo "::error::Känslig data hittades i repot. Se jobsammanfattningen."
            echo "SCAN_FAILED=true"  >> "$GITHUB_ENV"
            echo "SCAN_REPORT<<EOF" >> "$GITHUB_ENV"
            printf '%b' "$REPORT"   >> "$GITHUB_ENV"
            echo "EOF"              >> "$GITHUB_ENV"
          else
            echo "✅ Ingen känslig data hittades."
            echo "SCAN_FAILED=false" >> "$GITHUB_ENV"
          fi

          exit $FOUND

      - name: Write job summary
        if: always()
        run: |
          if [ "$SCAN_FAILED" = "true" ]; then
            cat >> "$GITHUB_STEP_SUMMARY" << 'SUMMARY'
          ## ❌ Känslig data hittades

          Nedan filer/rader innehåller känslig information som **inte** ska finnas i repot.
          Åtgärda innan merge tillåts.

          SUMMARY
            printf '%b\n' "$SCAN_REPORT" >> "$GITHUB_STEP_SUMMARY"
            cat >> "$GITHUB_STEP_SUMMARY" << 'SUMMARY'

          ### Tillåtna undantag
          Lägg till en kommentar `# noqa` på raden, eller använd platshållare som `<PLACEHOLDER>`.

          ### Policy
          Se [säkerhetspolicyn i README.md](../README.md#säkerhetspolicy-för-detta-repo).
          SUMMARY
          else
            echo "## ✅ Inga känsliga data hittades" >> "$GITHUB_STEP_SUMMARY"
            echo "Alla filer passerade granskningen." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if sensitive data found
        if: env.SCAN_FAILED == 'true'
        run: exit 1
